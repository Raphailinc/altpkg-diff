[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "package-comparison-tool"
version = "1.0.0"
description = "Compare ALT Linux binary packages between branches with JSON/Markdown reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["click>=8.5", "requests>=2.34.2"]

[project.urls]
Repository = "https://github.com/Raphailinc/altpkg-diff"

[project.scripts]
package-comparison = "package_comparison_tool.cli:main"
altpkg-diff = "package_comparison_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17.3", "responses>=0.25.0"]

[tool.setuptools]
py-modules = ["api", "cli"]

[tool.setuptools.packages.find]
include = ["package_comparison_tool*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
extend-ignore = ["E501", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
